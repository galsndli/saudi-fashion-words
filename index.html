<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عزّنا برؤيتنا</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f3ee;
      color: #29231f;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: white;
      border-radius: 28px;
      padding: 45px 30px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 38px;
    }

    .subtitle {
      font-size: 20px;
      margin-bottom: 30px;
      line-height: 1.7;
    }

    .input-area {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 25px;
    }

    #wordInput {
      flex: 1;
      max-width: 500px;
      padding: 15px 18px;
      border: 1px solid #d8d0c8;
      border-radius: 14px;
      font-size: 17px;
      outline: none;
    }

    #addButton {
      padding: 15px 22px;
      border: none;
      border-radius: 14px;
      background: #29231f;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #addButton:hover {
      opacity: 0.85;
    }

    #addButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #message {
      min-height: 25px;
      margin-bottom: 15px;
      font-size: 15px;
    }

    .cloud {
      min-height: 280px;
      border-radius: 22px;
      background: #faf8f5;
      padding: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      align-items: center;
      align-content: center;
    }

    .word {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: bold;
    }

    .counter {
      margin-top: 22px;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .container {
        padding: 30px 18px;
      }

      h1 {
        font-size: 30px;
      }

      .subtitle {
        font-size: 17px;
      }

      .input-area {
        flex-direction: column;
      }

      #wordInput {
        max-width: none;
        width: 100%;
      }

      #addButton {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>عزّنا برؤيتنا</h1>

    <div class="subtitle">
      بكلمة واحدة: كيف تساهمين في مستقبل الأزياء السعودية؟
    </div>

    <div class="input-area">
      <input
        id="wordInput"
        type="text"
        placeholder="اكتب كلمتك هنا..."
        maxlength="30"
      >

      <button id="addButton" onclick="addWord()">
        أضف كلمتك
      </button>
    </div>

    <div id="message"></div>

    <div id="wordCloud" class="cloud">
      ابدئي بإضافة أول كلمة ✨
    </div>

    <div class="counter">
      عدد المشاركات: <strong id="counter">0</strong>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://uwvoxsijuuwiyilbcvmo.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_Ah4wUKU-jObPSGXoh2DeTg_UNSZs9HE";

    const supabaseClient =
      window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const input = document.getElementById("wordInput");
    const button = document.getElementById("addButton");
    const cloud = document.getElementById("wordCloud");
    const counter = document.getElementById("counter");
    const message = document.getElementById("message");

    async function loadWords() {

      const { data, error } = await supabaseClient
        .from("words")
        .select("*")
        .order("created_at", { ascending: true });

      if (error) {
        console.error(error);
        message.textContent = "حدث خطأ في تحميل الكلمات";
        return;
      }

      displayWords(data || []);
    }

    function displayWords(words) {

      counter.textContent = words.length;

      if (words.length === 0) {
        cloud.innerHTML = "ابدئي بإضافة أول كلمة ✨";
        return;
      }

      cloud.innerHTML = "";

      words.forEach((item, index) => {

        const span = document.createElement("span");

        span.className = "word";
        span.textContent = item.word;

        const sizes = [18, 20, 22, 25, 28, 31, 34];
        span.style.fontSize =
          sizes[index % sizes.length] + "px";

        cloud.appendChild(span);
      });
    }

    async function addWord() {

      const word = input.value.trim();

      if (!word) {
        message.textContent = "اكتبي كلمة أولًا ✨";
        return;
      }

      button.disabled = true;
      message.textContent = "جاري الإضافة...";

      const { error } = await supabaseClient
        .from("words")
        .insert([{ word: word }]);

      if (error) {
        console.error(error);
        message.textContent = "ما قدرت أضيف الكلمة، حاولي مرة ثانية";
        button.disabled = false;
        return;
      }

      input.value = "";
      message.textContent = "تمت إضافة كلمتك ✨";

      await loadWords();

      button.disabled = false;
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        addWord();
      }
    });

    loadWords();

    setInterval(loadWords, 3000);
  </script>

</body>
</html>
