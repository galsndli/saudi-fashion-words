<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>عزّنا برؤيتنا</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f2ea;
      color: #29251f;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 45px 20px;
      text-align: center;
    }

    .title {
      font-size: 48px;
      font-weight: 800;
      margin: 20px 0 10px;
    }

    .subtitle {
      font-size: 20px;
      margin-bottom: 35px;
      color: #665f55;
    }

    .card {
      background: #fffdf9;
      border-radius: 28px;
      padding: 35px 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.07);
    }

    .question {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    input {
      width: min(500px, 90%);
      padding: 16px 20px;
      border: 1px solid #d8d0c5;
      border-radius: 15px;
      font-size: 17px;
      text-align: right;
      outline: none;
      background: white;
    }

    input:focus {
      border-color: #8a7761;
    }

    button {
      border: none;
      background: #29251f;
      color: white;
      padding: 15px 28px;
      border-radius: 15px;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .counter {
      color: #776f65;
      margin-bottom: 20px;
    }

    .cloud {
      min-height: 330px;
      display: flex;
      align-items: center;
      justify-content: center;
      align-content: center;
      flex-wrap: wrap;
      gap: 15px;
      padding: 25px;
    }

    .word {
      display: inline-block;
      padding: 8px 14px;
      font-weight: bold;
      transition: transform 0.2s;
    }

    .word:hover {
      transform: scale(1.1);
    }

    .footer {
      margin-top: 25px;
      font-size: 14px;
      color: #8a8278;
    }

    @media (max-width: 600px) {
      .title {
        font-size: 34px;
      }

      .subtitle {
        font-size: 17px;
      }

      .question {
        font-size: 20px;
      }

      .card {
        padding: 25px 15px;
      }

      input {
        width: 100%;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <h1 class="title">عزّنا برؤيتنا</h1>

    <p class="subtitle">
      نكتشف كيف نرى الأزياء السعودية بكلماتنا
    </p>

    <div class="card">

      <div class="question">
        بكلمة واحدة… ماذا تعني لك الأزياء السعودية؟
      </div>

      <div class="input-area">

        <input
          id="wordInput"
          type="text"
          placeholder="اكتب كلمتك هنا..."
          maxlength="30"
        >

        <button onclick="addWord()">
          أضف كلمتك
        </button>

      </div>

      <div class="counter">
        عدد المشاركات: <strong id="counter">0</strong>
      </div>

      <div class="cloud" id="cloud">
        <div class="word" style="font-size:32px;">هوية</div>
        <div class="word" style="font-size:25px;">أصالة</div>
        <div class="word" style="font-size:40px;">فخر</div>
        <div class="word" style="font-size:22px;">تراث</div>
        <div class="word" style="font-size:30px;">إبداع</div>
      </div>

    </div>

    <div class="footer">
      شارك بكلمة تعبّر عن رؤيتك
    </div>

  </div>


  <script>

    let words = [
      "هوية",
      "أصالة",
      "فخر",
      "تراث",
      "إبداع"
    ];

    function addWord() {

      const input = document.getElementById("wordInput");

      const word = input.value.trim();

      if (word === "") {
        alert("اكتب كلمة أولاً");
        return;
      }

      words.push(word);

      input.value = "";

      displayWords();
    }


    function displayWords() {

      const cloud = document.getElementById("cloud");

      cloud.innerHTML = "";

      words.forEach(function(word) {

        const element = document.createElement("span");

        element.className = "word";

        const size =
          Math.floor(Math.random() * 22) + 20;

        element.style.fontSize = size + "px";

        element.textContent = word;

        cloud.appendChild(element);

      });

      document.getElementById("counter").textContent =
        words.length;

    }

  </script>

</body>
</html>
