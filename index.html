<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عزّنا برؤيتنا</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f2ea;
      color: #29251f;
    }

    .page {
      max-width: 1100px;
      margin: auto;
      padding: 45px 20px;
      text-align: center;
    }

    .title {
      font-size: 48px;
      font-weight: 800;
      margin: 20px 0 10px;
    }

    .subtitle {
      font-size: 20px;
      color: #665f55;
      margin-bottom: 35px;
    }

    .card {
      background: #fffdf9;
      border-radius: 28px;
      padding: 35px 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.07);
    }

    .question {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    input {
      width: min(500px, 90%);
      padding: 16px 20px;
      border: 1px solid #d8d0c5;
      border-radius: 15px;
      font-size: 17px;
      outline: none;
      background: white;
    }

    button {
      border: none;
      background: #29251f;
      color: white;
      padding: 15px 28px;
      border-radius: 15px;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .counter {
      color: #776f65;
      margin: 15px 0;
    }

    .cloud {
      min-height: 330px;
      display: flex;
      align-items: center;
      justify-content: center;
      align-content: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 25px;
    }

    .word {
      display: inline-block;
      padding: 7px 13px;
      font-weight: bold;
      transition: transform 0.2s;
    }

    .word:hover {
      transform: scale(1.1);
    }

    .message {
      min-height: 24px;
      margin-top: 10px;
      color: #776f65;
    }

    .footer {
      margin-top: 25px;
      font-size: 14px;
      color: #8a8278;
    }

    @media (max-width: 600px) {
      .title {
        font-size: 34px;
      }

      .question {
        font-size: 20px;
      }

      input,
      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <h1 class="title">عزّنا برؤيتنا</h1>

    <p class="subtitle">
      نكتشف كيف نرى الأزياء السعودية بكلماتنا
    </p>

    <div class="card">

      <div class="question">
       بكلمة واحدة: كيف تساهمين في مستقبل الأزياء السعودي؟
      </div>ة

      <div class="input-area">

        <input
          id="wordInput"
          type="text"
          placeholder="اكتب كلمتك هنا..."
          maxlength="30"
        >

        <button id="addButton" onclick="addWord()">
          أضف كلمتك
        </button>

      </div>

      <div class="counter">
        عدد المشاركات: <strong id="counter">0</strong>
      </div>

      <div id="message" class="message"></div>

      <div id="cloud" class="cloud"></div>

    </div>

    <div class="footer">
      شارك بكلمة تعبّر عن رؤيتك
    </div>

  </div>


  <script>

    // =====================================================
    // ضعي معلومات Supabase الخاصة بك هنا
    // =====================================================

    const SUPABASE_URL = "https://uwvoxsijuuwiyilbcvmo.supabase.co/rest/v1/";

    const supabaseClient = window.supabase.createClient( SUPABASE_URL,SUPABASE_KEY
      );
 
    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // =====================================================
    // عرض الكلمات
    // =====================================================

    async function loadWords() {

      const { data, error } =
        await supabaseClient
          .from("words")
          .select("*")
          .order("created_at", {
            ascending: true
          });

      if (error) {
        console.error(error);
        showMessage("حدث خطأ في تحميل الكلمات");
        return;
      }

      displayWords(data || []);
    }


    function displayWords(words) {

      const cloud =
        document.getElementById("cloud");

      cloud.innerHTML = "";

      document.getElementById("counter").textContent =
        words.length;


      words.forEach(function(item) {

        const element =
          document.createElement("span");

        element.className = "word";

        const size =
          Math.floor(Math.random() * 25) + 20;

        element.style.fontSize =
          size + "px";

        element.textContent =
          item.word;

        cloud.appendChild(element);

      });

    }


    // =====================================================
    // إضافة كلمة
    // =====================================================

    async function addWord() {

      const input =
        document.getElementById("wordInput");

      const button =
        document.getElementById("addButton");

      const word =
        input.value.trim();


      if (!word) {

        showMessage("اكتب كلمة أولاً");

        return;
      }


      button.disabled = true;

      showMessage("جاري إضافة كلمتك...");


      const { error } =
        await supabaseClient
          .from("words")
          .insert([
            {
              word: word
            }
          ]);


      if (error) {

        console.error(error);

        showMessage(
          "ما قدرت أضيف الكلمة، حاولي مرة ثانية"
        );

        button.disabled = false;

        return;
      }


      input.value = "";

      showMessage("تمت إضافة كلمتك 🤍");

      button.disabled = false;

      loadWords();

    }


    function showMessage(text) {

      document.getElementById("message").textContent =
        text;

    }


    // =====================================================
    // تحديث الكلمات تلقائيًا
    // =====================================================

    loadWords();

    setInterval(loadWords, 3000);

  </script>

</body>
</html>
